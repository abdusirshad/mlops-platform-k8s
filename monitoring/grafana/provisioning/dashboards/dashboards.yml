# Auto-load dashboards from disk on Grafana startup.
apiVersion: 1

providers:
  - name: mlops-dashboards
    orgId: 1
    folder: MLOps
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
