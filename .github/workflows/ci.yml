name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.20

      - name: Ruff lint
        run: ruff check training serving

      - name: Install service dependencies
        run: |
          pip install -r training/requirements.txt
          pip install -r serving/requirements.txt

      - name: Byte-compile all Python
        run: python -m compileall training serving

      - name: Import-check the FastAPI app
        run: python -c "import importlib.util,sys; spec=importlib.util.spec_from_file_location('app','serving/app.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); assert hasattr(m,'app'); print('FastAPI app imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [mlflow, training, serving]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          tags: mlops-platform/${{ matrix.image }}:ci
